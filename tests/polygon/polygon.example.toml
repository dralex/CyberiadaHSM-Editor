# The test polygon configuration: copy to polygon.toml and fill in the
# backends; a key never enters this file, only where it lives: a file or
# the name of an environment variable (see docs/POLYGON.md, LLM backends)

[run]
timeout = 30       # seconds per editor run
calls = 40         # model requests per session
seconds = 0        # wall-clock limit of a session, 0 for none

[render]
probe_px = 2       # pixels sampled around the expected border path
ink_min = 0.5      # the ink ratio below which an element counts as unpainted

[backend.deepseek]
model = "deepseek:deepseek-chat"       # a Pydantic AI model id, provider:model-name
key_file = "~/DEEPSEEK_API_KEY"        # or key_env = "DEEPSEEK_API_KEY"
max_calls = 40
temperature = 0.7

[backend.local]
model = "openai:qwen2.5-coder:32b"     # any server speaking the chat completions protocol
key_env = "OPENAI_API_KEY"             # with OPENAI_BASE_URL in the environment
max_calls = 40
